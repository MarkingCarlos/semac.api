spring.application.name=java_api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/semac2026
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Segredo do JWT (HS256). Em produção, defina a env JWT_SECRET com >=32 chars.
# O valor abaixo é apenas para desenvolvimento.
jwt.secret=${JWT_SECRET:dev-semac-2026-troque-este-segredo-em-producao-32+}

app.upload.dir=${UPLOAD_DIR:${user.home}/semac-uploads/pagamentos}
