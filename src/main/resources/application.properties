spring.application.name=java_api

# Carrega java_api/.env.local (se existir) na execucao local, onde nao ha
# docker compose para injetar as variaveis de e-mail. Caminho relativo ao
# diretorio de trabalho, ou seja, java_api/. O "optional:" faz a aplicacao
# subir normalmente quando o arquivo nao existe — em producao, por exemplo.
# Variavel de ambiente continua vencendo o que vier daqui.
spring.config.import=optional:file:.env.local[.properties]

server.port=8080

server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5432/semac2026
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Aabba0201}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Segredo do JWT (HS256, >=32 chars). Sem valor padrão de propósito — igual
# DB_USERNAME/DB_PASSWORD acima, a app não deve subir sem essa env definida.
jwt.secret=${JWT_SECRET:zpUeHLZZRZ1ODL+rF41nBqVr4UsXMlQtMrb7NE7PW2HeMy1XFtc37yWCTA3o9vUF}

# Access token da Mercado Pago (sandbox ou produção, conforme o ambiente).
# Sem valor padrão de propósito, mesmo motivo do jwt.secret acima.
mercadopago.access.token=${MERCADOPAGO:APP_USR-7917025359849751-090415-6cc09f4c0a40832c4e6b366151bd9974-3666808688}


app.upload.dir=${UPLOAD_DIR:${user.home}/semac-uploads/pagamentos}
app.upload.dir.logos=${UPLOAD_DIR_LOGOS:${user.home}/semac-uploads/patrocinadores}
app.upload.dir.conquistas=${UPLOAD_DIR_CONQUISTAS:${user.home}/semac-uploads/conquistas}

# Padrão do Spring é 1MB por arquivo, baixo demais pra logo de patrocinador.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Seed do primeiro DIRETOR_SITE (ver SeedDiretorSiteRunner) — só roda se o
# banco ainda não tiver nenhum DIRETOR_SITE. Sem valor padrão de propósito
# para email/senha: sem essas envs, o seed simplesmente não cria ninguém.
seed.diretor.email=${SEED_DIRETOR_EMAIL:}
seed.diretor.senha=${SEED_DIRETOR_SENHA:}
seed.diretor.nome=${SEED_DIRETOR_NOME:Diretor(a) Site}
seed.diretor.cpf=${SEED_DIRETOR_CPF:00000000000}

# --- Envio de e-mail (SMTP) ---------------------------------------------
# Padrões apontam para o Gmail. A senha NÃO é a senha da conta: é uma
# "Senha de app" de 16 caracteres gerada em myaccount.google.com/apppasswords
# (exige verificação em duas etapas ativa em semacsjrp@gmail.com).
# Sem MAIL_USERNAME/MAIL_PASSWORD a app sobe normalmente — só não envia.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
# Sem timeout o envio pode travar a thread do pool de e-mail indefinidamente.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Chave geral de envio: com false o EmailService só loga o que enviaria.
# Padrão false de propósito — ninguém dispara e-mail pra participante real
# sem ligar isso conscientemente no ambiente.
app.mail.habilitado=${MAIL_HABILITADO:false}
app.mail.remetente=${MAIL_REMETENTE:semacsjrp@gmail.com}
app.mail.nome=${MAIL_NOME_REMETENTE:SEMAC XXXVI}
# Usada nos links dentro dos e-mails (área do participante).
app.site.url=${APP_SITE_URL:http://localhost:5173}

# Intervalo entre mensagens de um comunicado em lote. Serve de freio contra
# o limite diario do Gmail (~500/dia) e contra bloqueio por rajada.
app.mail.intervalo.lote.ms=${MAIL_INTERVALO_LOTE_MS:1200}
