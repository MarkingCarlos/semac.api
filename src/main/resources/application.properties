spring.application.name=java_api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/semac2026
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Segredo do JWT (HS256, >=32 chars). Sem valor padrão de propósito — igual
# DB_USERNAME/DB_PASSWORD acima, a app não deve subir sem essa env definida.
jwt.secret=${JWT_SECRET}

app.upload.dir=${UPLOAD_DIR:${user.home}/semac-uploads/pagamentos}
app.upload.dir.logos=${UPLOAD_DIR_LOGOS:${user.home}/semac-uploads/patrocinadores}

# Padrão do Spring é 1MB por arquivo, baixo demais pra logo de patrocinador.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
